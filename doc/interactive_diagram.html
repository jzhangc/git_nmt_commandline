<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMT Workflow - Interactive Diagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #ffffff;
  color: #333333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 {
  font-size: 1.5rem;
  margin-bottom: 8px;
  color: #333333;
}
.subtitle {
  font-size: 0.85rem;
  color: #666666;
  margin-bottom: 20px;
}
.legend {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: #cbd5e1;
}
.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 3px;
}
.diagram-container {
  width: 100%;
  max-width: 1400px;
  overflow-x: auto;
  position: relative;
}
svg { display: block; }
.box {
  cursor: pointer;
  transition: filter 0.2s, opacity 0.2s;
}
.box:hover { filter: brightness(1.3); }
.box-label {
  font-family: 'Segoe UI', system-ui, sans-serif;
  fill: #0f172a;
  text-anchor: middle;
  pointer-events: none;
  font-weight: 600;
}
.box-label-sm {
  font-family: 'Segoe UI', system-ui, sans-serif;
  fill: #0f172a;
  text-anchor: middle;
  pointer-events: none;
  font-weight: 500;
  font-size: 10px;
}
.box-label-wl {
  font-family: 'Segoe UI', system-ui, sans-serif;
  fill: #0f172a;
  text-anchor: middle;
  pointer-events: none;
  font-weight: 700;
  font-size: 11px;
}
.detail-panel {
  position: fixed;
  top: 0;
  right: -420px;
  width: 400px;
  height: 100vh;
  background: #1e293b;
  border-left: 1px solid #334155;
  box-shadow: -4px 0 24px rgba(0,0,0,0.4);
  transition: right 0.3s ease;
  overflow-y: auto;
  z-index: 100;
  padding: 24px;
}
.detail-panel.active { right: 0; }
.detail-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.detail-overlay.active { opacity: 1; pointer-events: all; }
.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 1.5rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}
.detail-close:hover { background: #334155; color: #f8fafc; }
.detail-title {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 4px;
  padding-right: 40px;
}
.detail-type {
  font-size: 0.75rem;
  color: #64748b;
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.detail-section {
  margin-bottom: 16px;
}
.detail-section h3 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #64748b;
  margin-bottom: 8px;
}
.detail-section p {
  font-size: 0.85rem;
  line-height: 1.6;
  color: #cbd5e1;
}
.detail-link {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 14px;
  background: #3b82f6;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 500;
}
.detail-link:hover { background: #2563eb; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-right: 4px;
  margin-bottom: 4px;
}
.badge-class { background: #f59e0b; color: #0f172a; }
.badge-reg { background: #10b981; color: #0f172a; }
.badge-2d { background: #8b5cf6; color: #fff; }
.badge-conn { background: #ec4899; color: #fff; }
.badge-cv { background: #f43f5e; color: #fff; }
.cond-branch {
  font-size: 10px;
  fill: #64748b;
  font-weight: 500;
  font-family: 'Segoe UI', system-ui, sans-serif;
  pointer-events: none;
}
.cond-branch-active {
  fill: #fbbf24;
  font-weight: 700;
}
.connector {
  stroke: #475569;
  stroke-width: 2;
  fill: none;
  marker-end: url(#arrow);
}
.connector-dashed {
  stroke: #475569;
  stroke-width: 1.5;
  stroke-dasharray: 6 4;
  fill: none;
  marker-end: url(#arrow);
}
.input-arrow {
  stroke: #64748b;
  stroke-width: 1.5;
  fill: none;
  marker-end: url(#arrow);
  marker-start: url(#arrow-start);
}
.section-label {
  font-family: 'Segoe UI', system-ui, sans-serif;
  fill: #64748b;
  text-anchor: middle;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.flow-label {
  font-family: 'Segoe UI', system-ui, sans-serif;
  text-anchor: middle;
  font-size: 9px;
  fill: #94a3b8;
  font-weight: 500;
}
</style>
</head>

function showDetail(key) {
  const d = details[key];
  if (!d) return;
  let html = `<div class="detail-title" style="color:${d.color}">${d.title}</div>`;
  html += `<div class="detail-type">${d.type}</div>`;
  d.sections.forEach(s => {
    html += `<div class="detail-section"><h3>${s.title}</h3>`;
    if (s.link) {
      html += `<a href="${s.link}" class="detail-link" target="_blank">View Source →</a>`;
    } else {
      html += `<p>${s.text.replace(/\n/g, '<br>')}</p>`;
    }
    html += `</div>`;
  });
  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailPanel').classList.add('active');
  document.querySelector('.detail-overlay').classList.add('active');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('active');
  document.querySelector('.detail-overlay').classList.remove('active');
}

function hlBox(key) {
  document.querySelectorAll('.box').forEach(b => b.style.opacity = '0.35');
  const box = document.querySelector(`[onclick="showDetail('${key}')"]`);
  if (box) box.style.opacity = '1';
}

function unhlBox(key) {
  document.querySelectorAll('.box').forEach(b => b.style.opacity = '1');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
